<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131c">
  <title>Contato · Ajing Game</title>
  <style>
    :root{color-scheme:dark;--bg:#07131c;--panel:#10222e;--line:#294250;--text:#f2f7f9;--muted:#a8bac3;--accent:#22c1d6;--red:#ef4652}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% -10%,#183745 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,620px);padding:clamp(22px,5vw,42px);border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 24px 80px #0005}
    header{text-align:center;margin-bottom:28px}header img{display:block;width:132px;height:132px;object-fit:contain;margin:0 auto 12px}h1{margin:0;font-size:clamp(1.7rem,5vw,2.25rem);line-height:1.1}header p{margin:10px 0 0;color:var(--muted)}
    form{display:grid;gap:16px}.field{display:grid;gap:6px}.field label{font-size:.9rem;font-weight:700}.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid #3c5968;border-radius:10px;background:#081821;color:var(--text);font:inherit;outline:none}.field textarea{min-height:150px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #22c1d622}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    button{min-height:48px;padding:11px 18px;border:0;border-radius:10px;background:linear-gradient(110deg,#19a9cd,#4bd4c5);color:#061720;font:800 1rem system-ui,sans-serif;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.status{min-height:1.4em;margin:0;font-weight:650}.status.error{color:#ff9ca3}.status.success{color:#7be2b0}.back{display:inline-block;margin-top:18px;color:#8fe3ed;text-decoration:none}.back:hover{text-decoration:underline}.honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
    @media(max-width:540px){body{padding:14px 10px}main{border-radius:16px}.row{grid-template-columns:1fr;gap:16px}header img{width:112px;height:112px}}
  </style>
</head>
<body>
  <main>
    <header>
      <img src="./logo-ajing.webp" alt="Ajing Game · Extreme Finesse" width="132" height="132">
      <h1>Fale com a administração</h1>
      <p>Envie sua mensagem. Nossa equipe receberá o contato na caixa de mensagens do perfil administrativo.</p>
    </header>
    <form id="contactForm">
      <div class="field"><label for="fullName">Nome completo</label><input id="fullName" name="fullName" autocomplete="name" minlength="2" maxlength="100" required></div>
      <div class="row">
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160" required></div>
        <div class="field"><label for="phone">Telefone</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" pattern="[0-9+() .-]{8,24}" placeholder="(27) 99999-9999" required></div>
      </div>
      <div class="field"><label for="subject">Assunto</label><input id="subject" name="subject" maxlength="120" required></div>
      <div class="field"><label for="message">Mensagem</label><textarea id="message" name="message" maxlength="3000" minlength="10" required></textarea></div>
      <div class="honeypot" aria-hidden="true"><label for="website">Não preencha este campo</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button id="sendButton" type="submit">Enviar mensagem</button>
    </form>
    <a class="back" href="./index.html">← Voltar ao Ajing Game</a>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const app = initializeApp({
      apiKey: 'AIzaSyDZ0uuHjWiZji2NSe7xEqJstbJ3d_2zP2s',
      authDomain: 'ajing-game.firebaseapp.com',
      projectId: 'ajing-game',
      storageBucket: 'ajing-game.firebasestorage.app',
      messagingSenderId: '11754429364',
      appId: '1:11754429364:web:a44f811e148ef6e25970e1'
    });
    const db = getFirestore(app), form = document.getElementById('contactForm');
    const status = document.getElementById('status'), sendButton = document.getElementById('sendButton');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      if (document.getElementById('website').value) return;
      const data = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        message: document.getElementById('message').value.trim()
      };
      if (Object.values(data).some(value => !value)) {
        status.className = 'status error'; status.textContent = 'Preencha todos os campos antes de enviar.'; return;
      }
      sendButton.disabled = true; status.className = 'status'; status.textContent = 'Enviando…';
      try {
        const ref = doc(collection(db, 'contactMessages'));
        await setDoc(ref, { id: ref.id, ...data, created: Date.now(), read: false });
        form.reset(); status.className = 'status success'; status.textContent = 'Mensagem enviada. Obrigado por entrar em contato!';
      } catch (error) {
        console.error('Falha ao enviar contato:', error && error.code);
        status.className = 'status error';
        status.textContent = error && error.code === 'permission-denied'
          ? 'Não foi possível enviar. As regras do Firestore ainda precisam ser atualizadas.'
          : 'Não foi possível enviar agora. Verifique sua conexão e tente novamente.';
      } finally { sendButton.disabled = false; }
    });
  </script>
</body>
</html>
